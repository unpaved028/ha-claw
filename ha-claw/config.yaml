# HA-Claw Add-on Manifest
# Reference: https://developers.home-assistant.io/docs/add-ons/configuration

name: 'HA-Claw'
version: '1.0.0'
slug: 'ha-claw'
description: 'Local AI-powered Smart Home Assistant with Telegram & Web UI'
url: 'https://github.com/unpaved028/ha-claw'

# Supported architectures (HA Green = aarch64)
arch:
  - aarch64
  - amd64

# Lifecycle
init: false
startup: application
boot: auto
watchdog: 'http://[HOST]:[PORT:3100]/health'

# ── Ingress (Web-UI in HA Sidebar) ────────────────────────────
ingress: true
ingress_port: 3100
panel_icon: 'mdi:robot-outline'
panel_title: 'HA-Claw'

# ── API Access ────────────────────────────────────────────────
homeassistant_api: true
hassio_api: true
# Needed to list backups for System Health (GET /backups/info).
hassio_role: backup

# ── Persistent storage mapping ────────────────────────────────
map:
  - share:rw

# ── User-configurable options (shown in Add-on UI) ────────────
options:
  openrouter_api_key: ''
  openrouter_default_model: 'anthropic/claude-haiku-4.5'
  openai_api_key: ''
  telegram_bot_token: ''
  telegram_allowed_user_ids: ''
  log_level: 'info'

# ── Schema validation for options ─────────────────────────────
# NOTE: the model list must match src/core/models.ts – CI compares both.
schema:
  openrouter_api_key: 'str'
  openrouter_default_model: 'list(openrouter/free|openrouter/auto|anthropic/claude-haiku-4.5|anthropic/claude-sonnet-5|anthropic/claude-opus-5|google/gemini-3.7-flash|google/gemini-3.5-flash-lite|openai/gpt-5.6-luna|openai/gpt-5.6-sol|deepseek/deepseek-v4-flash|x-ai/grok-4.6)'
  openai_api_key: 'str?'
  telegram_bot_token: 'str?'
  telegram_allowed_user_ids: 'str?'
  log_level: 'list(debug|info|warn|error)'
